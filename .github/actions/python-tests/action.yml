name: Run Python tests and fuzzers
description: Run pytest and bounded Atheris fuzz tests for one Python version
inputs:
  python-version:
    description: Python version to use
    required: true
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        version: "0.12.3"

    - name: Install dependencies
      shell: bash
      run: uv sync --locked --group dev

    - name: Run pytest
      shell: bash
      run: uv run --no-sync pytest

    # Atheris wheels are available for the project's Python 3.13 and 3.14 versions.
    - name: Fuzz validators
      shell: bash
      if: ${{ inputs.python-version == '3.13' || inputs.python-version == '3.14' }}
      run: uv run --no-sync python tests/fuzz/test_fuzz_validators.py -atheris_runs=1000

    - name: Fuzz example harness
      shell: bash
      if: ${{ inputs.python-version == '3.13' || inputs.python-version == '3.14' }}
      run: uv run --no-sync python tests/fuzz/test_fuzz_example.py -atheris_runs=1000

    - name: Upload coverage report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ always() && hashFiles('coverage.xml') != '' }}
      with:
        name: coverage-${{ inputs.python-version }}
        path: coverage.xml
        retention-days: 5
