#:schema https://www.schemastore.org/prek.json

# Native prek configuration; require prek-only settings and built-in hooks.
minimum_prek_version = "0.5.9"
default_install_hook_types = ["pre-commit", "commit-msg"]

# `prek update` only considers hook repository tags at least 7 days old.
[update]
cooldown_days = 7

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext", "md"] },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "reuse", name = "reuse", entry = "uv run --locked --group dev reuse lint", language = "system", pass_filenames = false, always_run = true },
  { id = "ruff", name = "ruff", entry = "uv run --locked --group dev ruff check --fix", language = "system", types = ["python"] },
  { id = "ruff-format", name = "ruff-format", entry = "uv run --locked --group dev ruff format", language = "system", types = ["python"] },
  { id = "mypy", name = "mypy", entry = "uv run --locked --group dev mypy", language = "system", types = ["python"], exclude = "^typings/" },
  { id = "codespell", name = "codespell", entry = "uvx --from codespell codespell", language = "system", exclude = '^(LICENSES/.*|.*\.svg|.*\.lock)$' },
  { id = "detect-private-key", name = "detect private key", entry = "uvx --from pre-commit-hooks detect-private-key", language = "system" },
  { id = "conventional-pre-commit", name = "conventional commit", entry = "uvx --from conventional-pre-commit conventional-pre-commit", language = "system", stages = ["commit-msg"], always_run = true },
  { id = "uv-lock", name = "check uv.lock", entry = "uv lock --check", language = "system", pass_filenames = false, always_run = true },
  { id = "markdownlint", name = "markdownlint", entry = "npx --yes --min-release-age=7 --package=markdownlint-cli@latest markdownlint --config .markdownlint.yaml", language = "node", files = '\.md$' },
]
